<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>rock paper scissor</title>
</head>
<body>
    <div class="main">
        <div class="winner">
            <p id="win"></p>
        </div>
        <div class="contestents-wrapper">
            <div class="contestent">
                <button id="comp" class="contestent-choice">C</button>
                <p class="name">COMPUTER</p>
            </div>
            <div class="contestent">
                <button id="you" class="contestent-choice">Y</button>
                <p class="name">YOU</p>
            </div>
        </div>
        <div class="cards-wrapper">
            <button id="rock" class="card">✊🏻</button>
            <button id="paper" class="card">✂</button>
            <button id="scissor" class="card">📃</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
