<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>rock paper scissor</title>
</head>
<body>
    <div class="winner">
        <p id="win"></p>
    </div>
    <div class="battle-ground-wrapper">
        <div class="battle-ground">
            <div class="contestent">
                <button id="comp" class="contestent-choice">C</button>
                <p>COMPUTER</p>
            </div>
            <div class="contestent">
                <button id="you" class="contestent-choice">Y</button>
                <p>YOU</p>
            </div>
        </div>
    </div>
    <div class="cards-wrapper">
        <div class="cards">
            <button id="rock" class="card" onclick="rock()">✊🏻</button>
            <button id="paper" class="card" onclick="paper()">✂</button>
            <button id="scissor" class="card" onclick="scissor()">📃</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
